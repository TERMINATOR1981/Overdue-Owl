name: Daily Library Reminder Agent

on:
  schedule:
    - cron: '0 19 * * *' # Runs automatically at 11:00 AM UTC (4:00 PM PKT)
  workflow_dispatch:
    inputs:
      fine_rate:
        description: 'Fine rate per day'
        required: true
        default: '50.0'
      currency:
        description: 'Currency symbol'
        required: true
        default: 'PKR'

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Automation Agent
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          # This passes the inputs from Streamlit to Python!
          FINE_RATE: ${{ github.event.inputs.fine_rate || '50.0' }}
          CURRENCY: ${{ github.event.inputs.currency || 'PKR' }}
        run: python agent.py
