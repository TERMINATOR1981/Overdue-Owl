name: Streamlit Keep Alive

on:
  schedule:
    # Runs at 00:00 and 12:00 UTC every day (every 12 hours)
    - cron: '0 0,12 * * *'
  workflow_dispatch: # Allows you to trigger it manually from the Actions tab

jobs:
  auto_commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Create empty commit
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit --allow-empty -m "Keep alive: Prevent Streamlit sleep mode"
          git push
